"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000
scan_timeout = 30


# ============================================================
# Prompt
#
# Example:
#
#   aegis-spectrum   main  [!1 ?1]    v1.25.0
#   ❯
#
# or:
#
#   frontend   feature/ui    v24.6.0   Vue
#   ❯
# ============================================================

format = """
$directory\
$git_branch\
$git_status\
$fill\
$golang\
$nodejs\
$python\
$package\
$docker_context\
$custom\
$kubernetes\
$aws\
$cmd_duration\
$line_break\
$character"""

right_format = """
$status\
$jobs\
$time"""


# ============================================================
# Character
# ============================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"


# ============================================================
# Directory
# ============================================================

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = true
home_symbol = "~"

read_only = " "
read_only_style = "bold red"


# ============================================================
# Git
# ============================================================

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style))"

conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
up_to_date = ""

untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "


# ============================================================
# Fill
# ============================================================

[fill]
symbol = " "


# ============================================================
# Go
# ============================================================

[golang]
disabled = false
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

detect_extensions = ["go"]
detect_files = [
  "go.mod",
  "go.sum",
  "go.work",
  "go.work.sum",
  "glide.yaml",
  "Gopkg.yml",
  "Gopkg.lock",
  ".go-version"
]
detect_folders = ["Godeps"]


# ============================================================
# Node.js / npm / Vue
# ============================================================

[nodejs]
disabled = false
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

detect_extensions = [
  "js",
  "mjs",
  "cjs",
  "ts",
  "mts",
  "cts",
  "vue"
]

detect_files = [
  "package.json",
  ".node-version",
  ".nvmrc"
]

detect_folders = [
  "node_modules"
]


# ============================================================
# Vue
#
# Starship has no built-in Vue module, so this checks whether
# package.json contains Vue as a dependency.
# ============================================================

[custom.vue]
description = "Vue.js project"
symbol = " "
style = "bold green"
format = "[$symbol Vue]($style) "

command = "printf ''"

when = """
test -f package.json && grep -q '"vue"' package.json
"""


# ============================================================
# npm package version
#
# Useful in frontend projects, but kept subtle.
# ============================================================

[package]
disabled = false
symbol = "󰏗 "
style = "dimmed white"
format = "[$symbol$version]($style) "


# ============================================================
# Docker
# ============================================================

[docker_context]
disabled = false
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "


# ============================================================
# Kubernetes
# ============================================================

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold blue"
format = "[$symbol$context( \\($namespace\\))]($style) "


# ============================================================
# AWS
# ============================================================

[aws]
disabled = false
symbol = "󰸏 "
style = "bold yellow"
format = "[$symbol$profile( \\($region\\))]($style) "


# ============================================================
# Command duration
# ============================================================

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "yellow"
format = "[󰔟 $duration]($style) "


# ============================================================
# Status
# ============================================================

[status]
disabled = false
style = "bold red"
format = "[$symbol$status]($style) "

symbol = "✘ "
success_symbol = ""
not_executable_symbol = "126 "
not_found_symbol = "127 "
sigint_symbol = "INT "
signal_symbol = "SIG "


# ============================================================
# Background jobs
# ============================================================

[jobs]
symbol = "󰜎 "
style = "bold blue"
number_threshold = 1
symbol_threshold = 1
format = "[$symbol$number]($style) "


# ============================================================
# Time
# ============================================================

[time]
disabled = false
time_format = "%H:%M"
style = "dimmed white"
format = "[$time]($style)"


# ============================================================
# Disable noisy modules
# ============================================================

[os]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[battery]
disabled = true

